<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Estimator - Inbound Demo</title>
  <meta name="description" content="Try the HVAC inbound estimator: pick an issue, get a slot and a ballpark price, then see what the business owner sees on their end." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="2" />
      <path d="M16 9v7l5 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <div>
      <div class="brand-row">
        <span class="brand" id="brand-name">Demo HVAC Co.</span>
        <span class="demo-pill">Demo</span>
      </div>
      <div class="brand-sub">Interactive preview - nothing here is a real booking, message, or charge.</div>
    </div>
    <a class="back-link" href="/#demos">Back to Seqnc</a>
  </header>

  <nav class="view-tabs" role="tablist" aria-label="Demo view">
    <button class="view-tab" id="tab-customer" type="button" role="tab" aria-selected="true">Customer Booking Flow</button>
    <button class="view-tab" id="tab-admin" type="button" role="tab" aria-selected="false">Business Owner Dashboard</button>
  </nav>

  <main class="app-shell" id="customer-view">
    <div class="progress" id="progress"></div>
    <div class="card" id="step-container"></div>
  </main>

  <main class="admin-shell" id="admin-view" hidden>
    <div class="summary-row" id="summary-row"></div>
    <h2 class="section-title">Today's Emergency Slots</h2>
    <div id="slots-panel"></div>
    <h2 class="section-title">Job Tickets</h2>
    <div id="bookings-panel"></div>
  </main>

  <footer class="demo-footer">
    <button class="btn btn-secondary" id="restart-demo" type="button">Restart demo</button>
  </footer>

  <script src="demo-data.js"></script>
  <script src="demo.js"></script>
</body>
</html>
